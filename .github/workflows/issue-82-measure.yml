name: issue-82-emotional-flatline-measurement

on:
  push:
    branches:
      - measure/issue-82-emotional-flatline

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Fetch reproducible corpus
        run: npm run corpus:fetch

      - name: Verify corpus hashes
        run: npm run corpus:verify

      - name: Measure document-level discrimination
        run: node scripts/fp-measure.js --unit document --json > /tmp/document.json

      - name: Measure paragraph-level discrimination
        run: node scripts/fp-measure.js --unit paragraph --json > /tmp/paragraph.json

      - name: Summarize emotional-flatline
        run: |
          node <<'NODE' | tee /tmp/emotional-flatline-summary.txt
          const fs = require('node:fs');

          function extract(file) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const row = data.discrimination.find((item) => item.type === 'emotional-flatline');
            return {
              unit: data.unit,
              counts: data.counts,
              emotionalFlatline: row || {
                type: 'emotional-flatline',
                humanRate: 0,
                machineRate: 0,
                lift: 0,
                n: 0,
              },
              skipped: data.skipped,
            };
          }

          const result = {
            generatedAt: new Date().toISOString(),
            document: extract('/tmp/document.json'),
            paragraph: extract('/tmp/paragraph.json'),
          };

          console.log(JSON.stringify(result, null, 2));
          NODE

          {
            echo "## Issue #82 — emotional-flatline measurement"
            echo
            echo '```json'
            cat /tmp/emotional-flatline-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure reusable-gate human finding distribution
        run: |
          node <<'NODE' | tee /tmp/gate-threshold-distribution.json
          const AIDetector = require('./detector/patterns.js');
          const { readManifest, loadRows } = require('./scripts/corpus.js');

          const rows = [];
          for (const doc of readManifest().documents) {
            const loaded = loadRows(doc);
            if (!loaded) continue;
            for (const row of loaded) {
              if (row.class !== 'human') continue;
              const result = AIDetector.analyzeText(row.text, {
                contextMode: 'technical',
                sourceMode: 'rendered-markdown',
              });
              if (result.tooLong) continue;
              rows.push({
                id: row.id,
                register: row.register,
                findings: result.issues.length,
              });
            }
          }

          const counts = rows.map((row) => row.findings).sort((a, b) => a - b);
          const percentile = (p) => {
            if (!counts.length) return null;
            const index = Math.ceil(p * counts.length) - 1;
            return counts[Math.max(0, Math.min(index, counts.length - 1))];
          };
          const thresholds = {};
          const max = counts.length ? counts[counts.length - 1] : 0;
          for (let threshold = 0; threshold <= max; threshold += 1) {
            const failures = counts.filter((n) => n > threshold).length;
            thresholds[threshold] = {
              failures,
              rate: counts.length ? failures / counts.length : 0,
            };
          }

          const byRegister = {};
          for (const row of rows) {
            (byRegister[row.register] ||= []).push(row.findings);
          }
          for (const [register, values] of Object.entries(byRegister)) {
            values.sort((a, b) => a - b);
            byRegister[register] = {
              n: values.length,
              min: values[0],
              median: values[Math.ceil(0.5 * values.length) - 1],
              p95: values[Math.ceil(0.95 * values.length) - 1],
              max: values[values.length - 1],
            };
          }

          console.log(JSON.stringify({
            settings: {
              contextMode: 'technical',
              sourceMode: 'rendered-markdown',
              unit: 'human corpus row/document',
            },
            n: counts.length,
            min: counts[0] ?? null,
            median: percentile(0.5),
            p90: percentile(0.9),
            p95: percentile(0.95),
            p975: percentile(0.975),
            p99: percentile(0.99),
            max,
            thresholds,
            byRegister,
          }, null, 2));
          NODE

          {
            echo "## Reusable gate — human finding-count distribution"
            echo
            echo '```json'
            cat /tmp/gate-threshold-distribution.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-82-emotional-flatline-measurement
          path: |
            /tmp/document.json
            /tmp/paragraph.json
            /tmp/emotional-flatline-summary.txt
            /tmp/gate-threshold-distribution.json
          if-no-files-found: error
